name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
        with:
          # The BuildKit image itself comes from Docker Hub by default and
          # times out on shared runners; pull it from Google's mirror.
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          # Shared runners hit Docker Hub's anonymous pull limit (HTTP 429);
          # Google's public mirror serves the same library images.
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image tags
        id: tags
        run: |
          tags="ghcr.io/joaompfp/vaultreader:${GITHUB_REF_NAME}"
          # Pre-releases (tag contains '-') never move :latest.
          case "$GITHUB_REF_NAME" in
            *-*) ;;
            *) tags="${tags}"$'\n'"ghcr.io/joaompfp/vaultreader:latest" ;;
          esac
          {
            echo "list<<EOF"
            echo "$tags"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: GIT_SHA=${{ github.ref_name }}
          tags: ${{ steps.tags.outputs.list }}
      - name: Extract release notes from CHANGELOG
        run: |
          tag="${GITHUB_REF_NAME}"
          # Section "## <tag>" (also "## [<tag>]" or "## <tag> - date") up to
          # the next "## ". The version is matched as a whole word, so v1.0.1
          # never selects the v1.0.10 section.
          awk -v t="$tag" -v t2="${tag#v}" '
            /^## /{ if (on) exit; h=$0; gsub(/[\[\]]/,"",h);
                    split(h, f, /[ \t]+/);
                    if (f[2] == t || f[2] == t2) { on=1; next} }
            on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release ${tag}" > notes.md
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          # Idempotent: a re-run edits the existing release instead of failing.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md $flags
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md $flags
          fi
