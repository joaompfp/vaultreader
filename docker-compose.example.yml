# VaultReader — example Docker Compose
# Copy to docker-compose.yml and adjust the paths.

services:
  vaultreader:
    image: ghcr.io/joaompfp/vaultreader:latest
    container_name: vaultreader
    ports:
      - "8080:8080"
    volumes:
      - /path/to/your/vaults:/vaults:rw   # folders here are the vaults
      - /path/to/appdata:/appdata:rw      # config.json, shares, vault icons
    restart: unless-stopped
    # environment:
    #   # Optional Syncthing integration (sync status in the sidebar)
    #   SYNCTHING_API_KEY: "your-syncthing-api-key"
    #   SYNCTHING_API_URL: "http://syncthing:8384"

    # ── Behind a forward-auth reverse proxy (optional) ───────────────────────
    # Put VaultReader on a private network and let the proxy (Authelia,
    # Authentik, oauth2-proxy, Traefik forward-auth, ...) authenticate users.
    # The proxy passes the authenticated user in the Remote-User header.
    # Set "require_user": true in /appdata/config.json so requests without
    # that header are rejected (401), and never publish port 8080 directly.
    # networks:
    #   - proxy
    # labels:                      # Traefik example
    #   - "traefik.enable=true"
    #   - "traefik.http.routers.vaultreader.rule=Host(`notes.example.com`)"
    #   - "traefik.http.routers.vaultreader.entrypoints=websecure"
    #   - "traefik.http.routers.vaultreader.tls.certresolver=letsencrypt"
    #   - "traefik.http.routers.vaultreader.middlewares=forward-auth@docker"
    #   - "traefik.http.services.vaultreader.loadbalancer.server.port=8080"

# networks:
